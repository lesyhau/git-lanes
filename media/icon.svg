  <g fill="none" stroke="#ffffff" stroke-width="16" stroke-linecap="round">
    <path d="M84 40 V216"/>
    <path d="M84 196 C84 144 172 160 172 108 V40"/>
  </g>
  <g fill="#ffffff" stroke="#1f2328" stroke-width="8">
    <circle cx="84" cy="76" r="22"/>
    <circle cx="84" cy="196" r="22"/>
    <circle cx="172" cy="76" r="22"/>
  </g>
</svg>
